[project]
name = "ytdl-telegram-bot"
version = "1.0.0"
description = "Hosting-ready Telegram downloader bot powered by yt-dlp."
requires-python = ">=3.11"
dependencies = [
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "cryptography>=50.0.0",
    "kurigram>=2.2.24",
    "pymongo>=4.13.0",
    "py-tgcalls>=2.3.3",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "tgcrypto>=1.2.5",
    # See requirements.txt: the [default] extra keeps yt-dlp-ejs in lockstep
    # with yt-dlp instead of drifting out of the version yt-dlp will accept.
    "yt-dlp[default]>=2026.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start narrow and widen once the codebase is clean under each rule set.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter, not worth failing CI on
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The codebase is untyped-by-default today; tighten this incrementally
# per-module (via [[tool.mypy.overrides]]) rather than all at once.
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
